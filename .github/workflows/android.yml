name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.32.8"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Verify Flutter
        run: |
          flutter --version
          flutter --version | grep -q "Flutter ${FLUTTER_VERSION} " || {
            echo "::error::Wrong Flutter version"
            exit 1
          }

      - name: Generate Android wrapper if missing
        run: |
          if [ ! -f android/gradlew ]; then
            echo "android/gradlew is missing. Generating Android platform files..."
            flutter create \
              --platforms=android \
              --org com.mohammad \
              --project-name reminder \
              .
          fi

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Analyze project
        run: |
          flutter analyze --no-fatal-infos

      - name: Run tests
        run: |
          flutter test

      - name: Build Debug APK
        run: |
          flutter build apk \
            --debug \
            --build-number=${{ github.run_number }}

      - name: Verify Debug APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reminder-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
